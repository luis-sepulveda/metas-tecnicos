  SUP = b.dataset.s;
  $('filtros').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  pintar();
});

// calidad reactiva del mes: fallas de sus actividades (del Excel de calidad)
function calTxt(f){
  const c = f.cal; if(!c || !c.am) return '';
  const p = c.pm != null ? c.pm : (c.am ? 100 * c.fm / c.am : null);
  const antes = c.aa ? ` · mes anterior ${fmt(c.fa, 0)} de ${fmt(c.aa, 0)}` : '';
  // rojo solo si NO cumple la meta de calidad segun la pagina (28-09-2026);
  // con fallas dentro del limite queda gris
  return `<div class="pdia cal${(!f.okcr && !D.cr_sin_datos) ? ' hay' : ''}">Calidad: ${fmt(c.fm, 0)} falla${c.fm === 1 ? '' : 's'} de ${fmt(c.am, 0)} actividades`
    + (p != null ? ` (${fmt(p)}%)` : '') + `${antes}</div>`;
}

// Una celda por meta: visto verde si cumple, X roja si no, gris si no hay dato
function celda(estado, valor, det, etq, barra){
  const ico = estado === 'si' ? '✓' : estado === 'no' ? '✕' : estado === 'casi' ? '!' : '–';
  return `<div class="cel ${estado}"><span class="ico" aria-hidden="true">${ico}</span>
    <div style="min-width:0;flex:1"><div class="etq">${etq}</div><div class="val">${valor}</div>`
    + (det ? `<div class="det">${det}</div>` : '') + (barra || '') + `</div></div>`;
}

function fila(f){
  // Produccion: productos por dia contra la meta, con una barrita
  const tope = D.pd * 1.5, ancho = Math.min(100, 100 * (f.pdia || 0) / tope), meta = 100 * D.pd / tope;
  const ePx = f.okpx ? 'si' : (f.px != null && f.px >= D.cerca.px ? 'casi' : 'no');
  const barra = `<div class="mini" style="color:var(${ePx === 'si' ? '--ok' : ePx === 'casi' ? '--casi' : '--mal'})"><i style="width:${ancho}%"></i><b style="left:${meta}%"></b></div>`;
  // (28-09-2026, Luis) En pantalla se dice PUNTOS (la pagina y la empresa
  // les dicen "productos"; es lo mismo: 1 por cada Play).
  // Se muestra el TOTAL: puntos hechos contra la meta
  // total del periodo (4 por cada dia trabajado). El por dia queda abajo.
  const metaTot = D.pd * (f.pres || 0);
  const cProd = celda(ePx, `${fmt(f.prod)} de ${fmt(metaTot, 0)}`,
    `${fmt(f.pdia, 2)} por día · ${f.px == null ? '—' : fmt(f.px, 0) + '%'} de la meta`, 'Producción', barra);

  // Calidad: % de actividades con falla
  let cCal;
  const c = f.cal;
  if(D.cr_sin_datos) cCal = celda('sd', 'Sin datos', 'la página aún no la carga', 'Calidad');
  else {
    const p = c && c.am ? (c.pm != null ? c.pm : 100 * c.fm / c.am) : null;
    const val = p != null ? `${fmt(p)}% fallas` : (f.okcr ? 'Cumple' : 'No cumple');
    const det = c && c.am ? `${fmt(c.fm, 0)} de ${fmt(c.am, 0)} actividades` : '';
    const eCal = f.okcr ? 'si'
      : (p != null && D.mcal && p <= D.mcal.FTTH + D.cerca.cal_puntos ? 'casi' : 'no');
    cCal = celda(eCal, val, det, 'Calidad');
  }

  // Asistencia: dias presente de los dias del periodo
  const faltas = Math.max(0, (f.dias ?? 0) - (f.pres ?? 0));
  const eAsi = f.okas ? 'si' : (faltas <= D.cerca.faltas ? 'casi' : 'no');
  const cAsi = celda(eAsi, `${f.pres ?? 0} de ${f.dias ?? '—'} días`,
    f.okas ? '' : `faltó ${Math.max(0, (f.dias ?? 0) - (f.pres ?? 0))} día${(f.dias ?? 0) - (f.pres ?? 0) === 1 ? '' : 's'}`, 'Asistencia');

  // Semana anterior: si tambien falló (lo que dice que "va mal")
  let cAnt;
  if(!f.ant || f.ant.aus) cAnt = celda('sd', 'Sin dato', '', 'Semana anterior');
  else cAnt = f.ant.ok ? celda('si', 'Cumplió', '', 'Semana anterior')
                       : celda('no', 'No cumplió', 'repite', 'Semana anterior');

  return `<div class="fil"><div class="nom">${f.n}<span>${f.s}</span></div>${cProd}${cCal}${cAsi}${cAnt}</div>`;
}

function cabecera(){
  const mc = D.mcal ? `máx. ${fmt(D.mcal.FTTH, 2)}% fallas` : '';
  return `<div class="fil cab"><div>Técnico</div>
    <div>Producción<small>puntos hechos de la meta</small></div>
    <div>Calidad<small>${mc}</small></div>
    <div>Asistencia<small>todos los días</small></div>
    <div>Semana anterior<small>¿cumplió las 3?</small></div></div>`;
}

function pintar(){
  const L = D.filas.filter(f => SUP === 'Todos' || f.s === SUP);
  const n = L.length, c = k => L.filter(f => f[k]).length;
  const pct = x => n ? ` <small>${Math.round(1000 * x / n) / 10}%</small>` : '';
  $('resumen').innerHTML = [
    ['okpx', 'cumplen producción'], ['okcr', 'cumplen calidad reactiva'], ['okas', 'cumplen asistencia'], ['ok', 'cumplen las 3']
  ].map(([k, l], i) => (k === 'okcr' && D.cr_sin_datos)
      ? `<div class="res sd"><div class="v">Sin datos</div><div class="l">calidad reactiva · la página pone 100 a todos</div></div>`
      : `<div class="res${i === 3 ? ' tres' : ''}"><div class="v">${c(k)}/${n}${pct(c(k))}</div><div class="l">${l}${k === 'ok' && D.cr_sin_datos ? ' (sin contar calidad)' : ''}</div></div>`).join('');

  // primero los que fallan MAS metas; a igual cantidad, los que repiten y
  // despues el de menor produccion
  const nf = f => (!f.okpx) + (!f.okcr && !D.cr_sin_datos) + (!f.okas);
  const repite = f => (f.ant && !f.ant.ok && !f.ant.aus) ? 1 : 0;
  const no = L.filter(f => !f.ok && !f.aus).sort((a, b) =>
    nf(b) - nf(a) || repite(b) - repite(a) || (a.px ?? 0) - (b.px ?? 0));
  const aus = L.filter(f => f.aus).sort((a, b) => a.n.localeCompare(b.n));
  const si = L.filter(f => f.ok && !f.aus).sort((a, b) => (b.px ?? 0) - (a.px ?? 0));

  $('t-no').textContent = `No cumplen · ${no.length} técnico${no.length === 1 ? '' : 's'}`;
  $('n-no').textContent = 'Primero los que fallan más metas. Cada columna es una meta: ✓ cumple, ! está cerca, ✕ no cumple.';
  // agrupados por supervisor cuando se ven todos
  if(!no.length){ $('no').innerHTML = '<div class="vacio">Todos cumplen las metas en este período.</div>'; }
  else if(SUP === 'Todos'){
    const grupos = [...new Set(no.map(f => f.s))].sort();
    $('no').innerHTML = grupos.map(s => { const g = no.filter(f => f.s === s);
      return `<h3>${s} · ${g.length}</h3>` + cabecera() + g.map(fila).join(''); }).join('');
  } else { $('no').innerHTML = cabecera() + no.map(fila).join(''); }

  $('ley').innerHTML = `<span><span class="cel si" style="display:inline;padding:0;background:none"><span class="ico">✓</span></span>cumple la meta</span>`
    + `<span><span class="cel casi" style="display:inline;padding:0;background:none"><span class="ico">!</span></span>no cumple, pero está cerca</span>`
    + `<span><span class="cel no" style="display:inline;padding:0;background:none"><span class="ico">✕</span></span>no cumple</span>`
    + `<span><span class="cel sd" style="display:inline;padding:0;background:none"><span class="ico">–</span></span>sin datos</span>`;

  $('s-aus').style.display = aus.length ? '' : 'none';
  $('aus').innerHTML = aus.map(f => `<div class="aus-f"><div class="nom">${f.n}<span>${f.s}</span></div>
    <div class="det">${f.pres ?? 0} de ${f.dias ?? '—'} días presente · ${fmt(f.prod)} puntos</div></div>`).join('');

  $('t-si').textContent = `Cumplen · ${si.length} técnico${si.length === 1 ? '' : 's'}`;
  $('si').innerHTML = si.length ? cabecera() + si.map(fila).join('') : '';
}
pintar();
</script></body></html>
