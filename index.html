  const b64 = function(t){ return Uint8Array.from(atob(t), function(c){ return c.charCodeAt(0); }); };

    let k = ''; try { k = localStorage.getItem('pzDatos') || sessionStorage.getItem('pzDatos') || ''; } catch(e){}
